<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- Custom loading screen --- */
    #my-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    #my-loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #my-progress-bar-container {
      width: 300px;
      max-width: 60vw;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    #my-progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.15s ease-out;
    }

    #my-progress-text {
      color: #aaa;
      font-family: sans-serif;
      font-size: 14px;
      margin-top: 12px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="my-loading-screen">
    <!-- Swap this for your own logo/branding if you want -->
    <div id="my-progress-bar-container">
      <div id="my-progress-bar-fill"></div>
    </div>
    <p id="my-progress-text">Loading... 0%</p>
  </div>

  <script>
    // Fill these in to match your Build/ folder contents exactly (check filenames/casing).
    // If Decompression Fallback is on, loaderUrl stays plain JS (no .br) -- only data/framework/code get .br.
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "PortfolioButAwesome.loader";

    var config = {
      dataUrl: buildUrl + "PortfolioButAwesome.data.unityweb.br",
      frameworkUrl: buildUrl + "PortfolioButAwesome.framework.js.unityweb.br",
      codeUrl: buildUrl + "PortfolioButAwesome.wasm.unityweb.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Meowers Inc.",
      productName: "Alvin's Portfolio",
      productVersion: "v1.0",
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#my-loading-screen");
    var progressFill = document.querySelector("#my-progress-bar-fill");
    var progressText = document.querySelector("#my-progress-text");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + "%";
        progressText.textContent = "Loading... " + pct + "%";
      }).then(() => {
        loadingScreen.classList.add("fade-out");
        setTimeout(() => {
          loadingScreen.style.display = "none";
        }, 500); // matches the CSS transition duration above
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>

</body>
</html>
